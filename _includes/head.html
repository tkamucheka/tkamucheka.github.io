<head>
  <link href="http://gmpg.org/xfn/11" rel="profile" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <!-- Enable responsiveness on mobile devices-->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1"
  />

  <title>
    {% if page.title == "Home" %} {{ site.title }} &middot; {{ site.tagline }}
    {% else %} {{ page.title }} &middot; {{ site.title }} {% endif %}
  </title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl | absolute_url }}public/css/poole.css" />
  <link rel="stylesheet" href="{{ site.baseurl | absolute_url }}public/css/hyde.css" />
  <link rel="stylesheet" href="{{ site.baseurl | absolute_url }}public/css/syntax.css" />
  <link rel="stylesheet" href="{{ site.baseurl | absolute_url }}public/css/custom.css" />
  <!-- <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700|Abril+Fatface"> -->

  <!-- Icons -->
  <link rel="icon" href="{{ '/public/favicon.ico?v=2' | relative_url }}" sizes="48x48" />
  <link rel="icon" href="{{ '/public/favicon.svg?v=2' | relative_url }}" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{ '/public/apple-touch-icon.png?v=2' | relative_url }}" />

  <!-- RSS -->
  <link
    rel="alternate"
    type="application/rss+xml"
    title="RSS"
    href="/atom.xml"
  />
</head>
