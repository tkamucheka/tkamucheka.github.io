  <text x="830" y="62" font-family="'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#268bd2">LOADM     </tspan><tspan fill="#d6d6d6">R1, m</tspan></text>
  <text x="830" y="88" font-family="'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#268bd2">LOADROWV  </tspan><tspan fill="#d6d6d6">R2, v1</tspan></text>
  <text x="830" y="114" font-family="'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#268bd2">MULT      </tspan><tspan fill="#d6d6d6">R3, R1, R2</tspan></text>
  <text x="830" y="140" font-family="'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#268bd2">REDUCE    </tspan><tspan fill="#d6d6d6">R4, R3</tspan></text>
  <text x="830" y="166" font-family="'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#268bd2">LOADCOLV  </tspan><tspan fill="#d6d6d6">R5, v2</tspan></text>
  <text x="830" y="192" font-family="'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#268bd2">ADD       </tspan><tspan fill="#d6d6d6">R6, R4, R5</tspan></text>
  <text x="830" y="218" font-family="'Fira Code', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" xml:space="preserve"><tspan fill="#268bd2">STORECOLV </tspan><tspan fill="#d6d6d6">R6, out</tspan></text>
