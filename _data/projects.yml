# Open source projects, listed on /projects/ in this order. Each entry has a
# landing page at /projects/<slug>/ whose front matter names it with
# `project: <slug>`.

- group: dottr
  intro: A dotfiles and package manager with its own manifest language, and
    its editor support.
  projects:
    - slug: dottr
      name: dottr
      summary: Sets up a machine from a manifest of packages, configuration,
        and shell scripts, on Linux, macOS, and Windows.
      language: C
      license: MIT
      repos: [dottr]
    - slug: tree-sitter-dottr
      name: tree-sitter-dottr
      summary: Tree-sitter grammar and editor queries for dottr manifests.
      language: C (generated), JavaScript
      license: MIT
      repos: [tree-sitter-dottr]
    - slug: vscode-dottr
      name: vscode-dottr
      summary: Visual Studio Code extension for dottr manifests, with the dottr
        language server.
      language: TypeScript
      license: MIT
      repos: [vscode-dottr]

- group: Neovim and tree-sitter
  intro: Parser management for Neovim, and tree-sitter grammars for languages
    without one.
  projects:
    - slug: gardener.nvim
      name: gardener.nvim
      summary: Tree-sitter parser management for Neovim on the main branch of
        nvim-treesitter.
      language: Lua
      license: MIT
      repos: [gardener.nvim]
    - slug: tree-sitter-mlir
      name: tree-sitter-mlir
      summary: A tree-sitter grammar for MLIR, derived from the MLIR language
        reference rather than a list of dialects.
      language: C (generated), JavaScript
      license: MIT
      repos: [tree-sitter-mlir]
    - slug: tree-sitter-sparhl
      name: tree-sitter-sparhl
      summary: A tree-sitter grammar and highlighting for SPARHL programs.
      language: C (generated), JavaScript
      license: MIT
      repos: [tree-sitter-sparhl]

- group: Research code
  intro: Code from published research.
  projects:
    - slug: kyber512
      name: Kyber512 in Hardware
      summary: A pure-hardware Kyber512 CCA-secure key encapsulation mechanism
        for FPGAs, with a masked variant and AXI IP packages.
      language: Verilog, VHDL
      repos: [Kyber512_INDCCA2, Kyber512_INDCCA2_Masked, Kyber512_INDCCA2_AXI_IP,
        Kyber512_INDCCA2_Masked_AXI_IP]
    - slug: cusmc
      name: CuSMC
      summary: An R package for Sequential Monte Carlo sampling, accelerated with
        CUDA on NVIDIA GPUs.
      language: C++, CUDA, R
      license: GPL-3.0
      repos: [CuSMC]
